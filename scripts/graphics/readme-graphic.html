<!doctype html>
<!-- Source for docs/readme-graphic.png (2400x1400, rendered at 2x). Render with: node scripts/render-graphics.ts -->
<html>
<head>
<meta charset="utf-8" />
<style>
    @font-face { font-family: Monocraft; src: url(../../public/fonts/Monocraft.woff2); }
    @font-face { font-family: Manrope; font-weight: 500; src: url(../../node_modules/@fontsource/manrope/files/manrope-latin-500-normal.woff2); }

    :root {
        --ink: #2b1b5c;
        --paper: #f7f5ee;
        --paper-ink: #26242f;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 700px; overflow: hidden; }
    body {
        position: relative;
        background: linear-gradient(160deg, #d4c6fd 0%, #c6b4fa 45%, #b49ef6 100%);
        font-family: Monocraft, monospace;
        color: var(--ink);
    }

    /* The receipt, running off the top edge like it's still printing. */
    .receipt {
        position: absolute;
        left: 104px;
        top: -40px;
        width: 330px;
        padding: 64px 24px 24px;
        background: var(--paper);
        color: var(--paper-ink);
        transform: rotate(-3deg);
        transform-origin: top center;
        filter: drop-shadow(0 18px 30px rgba(43, 27, 92, 0.22));
    }
    .receipt::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -12px;
        height: 12px;
        background:
            linear-gradient(-45deg, transparent 8px, var(--paper) 0) 0 0 / 16px 12px repeat-x,
            linear-gradient(45deg, transparent 8px, var(--paper) 0) 0 0 / 16px 12px repeat-x;
    }
    .badge {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        margin: 0 auto 22px;
        border-radius: 18px;
        background: #c9b7fb;
        box-shadow: inset 0 0 0 3px #d9cdfd;
    }
    .badge img { width: 64px; height: 64px; image-rendering: pixelated; }
    .rule { border-top: 2px dashed #8f8a99; }
    .row { display: flex; justify-content: space-between; font-size: 20px; line-height: 34px; }
    .rows { padding: 10px 2px 8px; }
    .total {
        display: flex;
        justify-content: space-between;
        padding: 12px 2px 8px;
        font-size: 25px;
        border-bottom: 6px double #45424f;
    }
    .food { display: flex; flex-direction: column; align-items: center; padding-top: 22px; }
    .food img { width: 96px; height: 96px; image-rendering: pixelated; }
    .food .label { margin-top: 12px; font-size: 20px; }
    .food .name { margin-top: 6px; font-size: 27px; }
    .barcode { display: flex; height: 58px; margin-top: 20px; }
    .barcode span { background: var(--paper-ink); height: 100%; }

    .sprite {
        position: absolute;
        image-rendering: pixelated;
        filter: drop-shadow(6px 6px 0 rgba(43, 27, 92, 0.28));
    }

    .title {
        position: absolute;
        left: 556px;
        top: 52px;
        font-size: 64px;
        line-height: 76px;
        letter-spacing: 2px;
        white-space: nowrap;
    }
    .tagline {
        position: absolute;
        left: 560px;
        top: 142px;
        font-family: Manrope, sans-serif;
        font-weight: 500;
        font-size: 27px;
    }
    .schools { position: absolute; left: 560px; top: 198px; display: flex; gap: 10px; }
    .schools span {
        padding: 5px 10px 4px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.35);
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.6);
        font-size: 19px;
    }

    /* Browser window holding the desktop screenshot. */
    .browser {
        position: absolute;
        left: 560px;
        top: 262px;
        width: 600px;
        border-radius: 10px;
        overflow: hidden;
        background: #f2f1f6;
        box-shadow: 0 0 0 1px rgba(43, 27, 92, 0.1), 0 24px 50px rgba(43, 27, 92, 0.3);
    }
    .toolbar { position: relative; height: 30px; color: #7d7a88; }
    .lights { position: absolute; left: 12px; top: 50%; display: flex; gap: 6px; transform: translateY(-50%); }
    .lights i { width: 9px; height: 9px; border-radius: 50%; }
    .toolbar svg { position: absolute; top: 50%; width: 12px; height: 12px; transform: translateY(-50%); }
    .url {
        position: absolute;
        left: 150px;
        right: 150px;
        top: 5px;
        height: 20px;
        border-radius: 6px;
        background: #e3e1ea;
        color: #3d3a48;
        font: 500 10px Manrope, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    .url svg { position: static; transform: none; width: 8px; height: 8px; }
    .browser > img { display: block; width: 100%; }

    /* Phone holding the mobile screenshot, leaning against the browser. */
    .phone {
        position: absolute;
        left: 446px;
        top: 318px;
        width: 196px;
        height: 420px;
        padding: 3px;
        border-radius: 38px;
        background: linear-gradient(135deg, #f1f1f4 0%, #a9a9b2 30%, #e2e2e7 55%, #8e8e97 80%, #d6d6dc 100%);
        transform: rotate(-9deg);
        box-shadow: -14px 24px 44px rgba(43, 27, 92, 0.35);
    }
    .bezel { width: 100%; height: 100%; padding: 6px; border-radius: 35px; background: #0b0b0d; }
    .screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 29px; background: #efedf7; }
    .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .island {
        position: absolute;
        left: 50%;
        top: 7px;
        width: 54px;
        height: 16px;
        transform: translateX(-50%);
        border-radius: 8px;
        background: #000;
    }
</style>
</head>
<body>
    <div class="receipt">
        <div class="badge"><img src="../../public/favicon.svg" alt="" /></div>
        <div class="rule"></div>
        <div class="rows">
            <div class="row"><span>Y2S1</span><span>3.80</span></div>
            <div class="row"><span>Y2S2</span><span>3.50</span></div>
        </div>
        <div class="rule"></div>
        <div class="total"><span>TOTAL GPA</span><span>3.67</span></div>
        <div class="food">
            <img src="../../public/food/chicken-rice.png" alt="" />
            <div class="label">YOU CAN BUY</div>
            <div class="name">CHICKEN RICE</div>
        </div>
        <div class="barcode" id="barcode"></div>
    </div>

    <img class="sprite" src="../../public/food/ice.png" style="left: 26px; top: 34px; width: 116px; transform: rotate(-10deg)" alt="" />
    <img class="sprite" src="../../public/food/mcspicy.png" style="left: 420px; top: 84px; width: 116px; transform: rotate(10deg)" alt="" />
    <img class="sprite" src="../../public/food/bubble-tea.png" style="left: 52px; top: 470px; width: 108px; transform: rotate(-7deg)" alt="" />

    <div class="title">GPA BUY WHAT?</div>
    <div class="tagline">Calculate your GPA. See what it can buy.</div>
    <div class="schools"><span>NUS</span><span>NTU</span><span>SMU</span><span>POLY</span></div>

    <div class="browser">
        <div class="toolbar">
            <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
            <svg style="left: 66px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2.5" /><path d="M9 4v16" /></svg>
            <svg style="left: 92px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
            <div class="url">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V8a5 5 0 0 1 10 0v2h1.5v12h-13V10zm2.5 0h5V8a2.5 2.5 0 0 0-5 0z" /></svg>
                gpabuywhat.com
            </div>
        </div>
        <img src="../../docs/screenshot-desktop.png" alt="" />
    </div>

    <!-- After the browser, so it sits on top of its corner. -->
    <img class="sprite" src="../../public/food/nasi-lemak.png" style="left: 1090px; top: 566px; width: 96px; transform: rotate(9deg)" alt="" />

    <div class="phone">
        <div class="bezel">
            <div class="screen">
                <img src="../../docs/screenshot-mobile.png" alt="" />
                <div class="island"></div>
            </div>
        </div>
    </div>

    <script>
        // A fixed, decorative barcode so every render is identical.
        const widths = [3,1,2,1,1,3,2,1,1,2,3,1,1,1,2,2,1,3,1,1,2,1,3,2,1,1,2,1,1,3,1,2,2,1,1,1,3,1,2,1,1,2,3,1,1,2,1,1,2,3,1,1,2,1,1,3,2,1,2,1]
        const el = document.getElementById("barcode")
        widths.forEach((w, i) => {
            const bar = document.createElement("span")
            bar.style.width = `${w * 2}px`
            if (i % 2) bar.style.background = "transparent"
            el.appendChild(bar)
        })
    </script>
</body>
</html>
